<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EchoVro — Music is better together.</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f1b33;--navy2:#16294a;--cream:#efe5cf;--blue:#6f8bb0;--silver:#b8bfca;box-sizing:border-box}
*{box-sizing:inherit;margin:0}
html,body{height:100%;overflow:hidden;background:radial-gradient(120% 90% at 65% 40%,#1d3358 0%,#0f1b33 55%,#08101f 100%);color:var(--cream);font-family:'Cormorant Garamond',Georgia,serif}
canvas#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.ov{position:fixed;inset:0;pointer-events:none}
.vig{background:radial-gradient(ellipse at center,transparent 55%,rgba(5,9,18,.7) 100%),linear-gradient(0deg,rgba(8,16,31,.85),transparent 22%)}
.grain{opacity:.09;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#intro{position:fixed;left:5vw;bottom:calc(14vh + env(safe-area-inset-bottom,0px));max-width:min(520px,90vw);transition:opacity .2s;animation:rise 2s .6s both cubic-bezier(.2,.7,.2,1)}
.logo{display:flex;align-items:center;gap:14px}
.logo svg{width:clamp(34px,5vw,52px);flex:none}
.logo h1{font:700 clamp(44px,8vw,92px)/1 'Playfair Display',Georgia,serif;letter-spacing:.02em;color:var(--cream);text-shadow:0 0 40px rgba(111,139,176,.45)}
.logo h1 span{color:var(--silver);font-weight:500;font-style:italic}
.tag{margin-top:10px;font:italic 500 clamp(20px,3vw,32px)/1.2 'Cormorant Garamond',Georgia,serif;color:var(--silver);letter-spacing:.04em}
.rule{width:90px;height:1px;background:linear-gradient(90deg,var(--cream),transparent);margin:16px 0 0}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
#coll{position:fixed;top:calc(4vh + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;opacity:0;transition:opacity .2s}
#coll b{display:block;font:500 clamp(22px,3.4vw,38px) 'Playfair Display',Georgia,serif;letter-spacing:.18em;text-transform:uppercase}
#coll small{font:italic 500 18px 'Cormorant Garamond',serif;color:var(--silver)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(3vh + env(safe-area-inset-bottom,0px));display:flex;gap:22px;align-items:center;font:12px ui-monospace,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--silver);z-index:3}
nav button{all:unset;cursor:pointer;display:flex;gap:8px;align-items:center;opacity:.5;transition:opacity .3s;padding:8px 2px}
nav button i{width:9px;height:9px;border:1px solid var(--cream);border-radius:50%;transition:background .3s}
nav button.on{opacity:1}nav button.on i{background:var(--cream)}
#hint{position:fixed;right:5vw;top:50%;font:italic 500 20px 'Cormorant Garamond',serif;color:var(--silver);writing-mode:vertical-rl;opacity:.8;animation:nudge 2.4s infinite ease-in-out;transition:opacity .3s}
@keyframes nudge{50%{transform:translateX(-8px)}}
#tip{position:fixed;pointer-events:none;padding:6px 12px;background:rgba(15,27,51,.85);border:1px solid rgba(184,191,202,.35);font:12px ui-monospace,Menlo,monospace;letter-spacing:.08em;color:var(--cream);opacity:0;transform:translate(14px,14px);transition:opacity .15s;z-index:4;white-space:nowrap}
#panel{position:fixed;right:4vw;top:50%;width:min(360px,90vw);transform:translate(40px,-50%);opacity:0;pointer-events:none;transition:.5s cubic-bezier(.2,.7,.2,1);padding:26px 26px 22px;background:linear-gradient(160deg,rgba(239,229,207,.96),rgba(214,203,178,.96));color:var(--navy);border:1px solid var(--silver);box-shadow:0 30px 80px rgba(0,0,0,.5);z-index:5}
#panel.open{opacity:1;transform:translate(0,-50%);pointer-events:auto}
#panel h2{font:700 28px/1.1 'Playfair Display',serif}#panel .by{font-style:italic;font-size:20px;color:#3b5273;margin:4px 0 14px}
#panel ol{list-style:none;padding:0;border-top:1px solid rgba(15,27,51,.3)}
#panel li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dotted rgba(15,27,51,.35);font-size:19px}
#panel li em{font:12px ui-monospace,monospace;color:#3b5273;align-self:center}
.row{display:flex;gap:12px;align-items:center;margin-top:16px}
.row button{all:unset;cursor:pointer;padding:9px 16px;background:var(--navy);color:var(--cream);font:12px ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase}
.row button.g{background:none;color:var(--navy);border:1px solid var(--navy)}
.eq{display:flex;gap:3px;align-items:flex-end;height:22px;margin-left:auto}
.eq i{width:4px;background:var(--navy);height:100%;animation:eq .7s ease-in-out infinite alternate;animation-play-state:paused;transform-origin:bottom}
.eq i:nth-child(2){animation-delay:-.2s}.eq i:nth-child(3){animation-delay:-.45s}.eq i:nth-child(4){animation-delay:-.1s}
.playing .eq i{animation-play-state:running}
@keyframes eq{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
@media(max-width:700px){#panel{right:0;left:0;top:auto;bottom:0;width:100%;transform:translateY(40px);padding:18px 20px calc(70px + env(safe-area-inset-bottom,0px))}#panel.open{transform:none}#panel h2{font-size:22px}#panel li{padding:6px 0;font-size:17px}#hint{display:none}#intro{bottom:calc(12vh + env(safe-area-inset-bottom,0px))}}
#credit{position:fixed;right:12px;bottom:calc(8px + env(safe-area-inset-bottom,0px));font:10px ui-monospace,Menlo,monospace;letter-spacing:.06em;color:var(--silver);opacity:.45;z-index:3;max-width:46vw;text-align:right}#credit a{color:inherit;pointer-events:auto}@media(max-width:700px){#credit{display:none}}
</style></head><body>
<canvas id="c"></canvas>
<div class="ov vig"></div><div class="ov grain"></div>
<div id="intro">
  <div class="logo"><svg viewBox="0 0 48 48" fill="none" stroke="#efe5cf" stroke-width="2" stroke-linecap="round"><circle cx="24" cy="24" r="4" fill="#efe5cf"/><path d="M14 24a10 10 0 0 1 10-10M34 24a10 10 0 0 1-10 10" /><path d="M7 24A17 17 0 0 1 24 7M41 24a17 17 0 0 1-17 17" stroke="#b8bfca" opacity=".7"/></svg><h1>Echo<span>Vro</span></h1></div>
  <div class="rule"></div><p class="tag">Music is better together.</p>
</div>

<div id="tip"></div><div id="credit">Avatar: <a href="https://sketchfab.com/3d-models/girl-avatar-ready-player-me-087b7514d9d54bc689b2ca220f7e74f7" target="_blank" rel="noopener">“Girl Avatar – Ready Player Me”</a> by Hellencam · CC BY 4.0</div>
<aside id="panel"><h2 id="pt"></h2><div class="by" id="pb"></div><ol id="pl"></ol>
<div class="row"><button id="pp">▶ Preview</button><button class="g" id="px">Close</button><div class="eq"><i></i><i></i><i></i><i></i></div></div></aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const T=THREE,$=s=>document.querySelector(s);
const renderer=new T.WebGLRenderer({canvas:$('#c'),antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();scene.fog=new T.FogExp2(0x0f1b33,.026);
const camera=new T.PerspectiveCamera(40,1,.1,200);
let rand=(()=>{let s=7;return()=>(s=s*16807%2147483647)/2147483647})();
const R=(a,b)=>a+(b-a)*rand();

// Environment for reflections
{const es=new T.Scene();es.add(new T.Mesh(new T.BoxGeometry(30,30,30),new T.MeshBasicMaterial({color:0x16294a,side:T.BackSide})));
[[0,12,6,10,3,0xefe5cf,5],[-12,2,4,3,8,0x8fa8cc,3],[12,-1,-4,3,8,0xdfe6f0,4],[0,3,-13,14,5,0xb8bfca,2]].forEach(([x,y,z,w,h,c,i])=>{const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({color:new T.Color(c).multiplyScalar(i),side:T.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,0,0);es.add(m)});
scene.environment=new T.PMREMGenerator(renderer).fromScene(es,.02).texture}

// Lights (rig follows camera)
const lg=new T.Group();scene.add(lg);
const key=new T.SpotLight(0xfff1d6,1.7,60,.6,.6,1);key.position.set(4,8,8);key.castShadow=true;key.shadow.mapSize.set(1024,1024);key.shadow.bias=-.0005;lg.add(key,key.target);
const rim=new T.PointLight(0x7f9fd0,1.6,40);rim.position.set(-5,3,-5);lg.add(rim);
const rim2=new T.PointLight(0xc9d2e0,1,30);rim2.position.set(6,1,-4);lg.add(rim2);
scene.add(new T.HemisphereLight(0x8fa8cc,0x0f1b33,.35));
const floor=new T.Mesh(new T.PlaneGeometry(240,60),new T.ShadowMaterial({opacity:.45}));floor.rotation.x=-Math.PI/2;floor.position.set(-20,-3.6,0);floor.receiveShadow=true;scene.add(floor);const fill=new T.PointLight(0xdfe8ff,.6,30);fill.position.set(-3,1,7);lg.add(fill);

const M=(g,m,p=[0,0,0],s=[1,1,1])=>{const o=new T.Mesh(g,m);o.position.set(...p);o.scale.set(...s);o.castShadow=o.receiveShadow=true;return o};
const plaster=new T.MeshToonMaterial({color:0xffb98a});
const lid=new T.MeshStandardMaterial({color:0xd98a63,roughness:.6});
const lip=new T.MeshStandardMaterial({color:0xff4f8b,roughness:.5});
const silver=new T.MeshStandardMaterial({color:0xc9ced6,roughness:.18,metalness:1});
const navyM=new T.MeshStandardMaterial({color:0x16294a,roughness:.35,metalness:.6});
const leather=new T.MeshStandardMaterial({color:0xd9c9a8,roughness:.8});

// Avatar (Ready Player Me, embedded GLB)
const head=new T.Group();scene.add(head);head.position.y=.2;
const eyeBones=[];
(function(){
 new T.GLTFLoader().load('avatar.glb',gl=>{const av=gl.scene,k=10;av.scale.setScalar(k);av.position.set(0,-1.61*k,-.03*k);
  av.traverse(o=>{if(o.isBone&&/^(Left|Right)Eye_/.test(o.name))eyeBones.push(o);
   if(o.isMesh){o.frustumCulled=false;o.castShadow=o.receiveShadow=true;const m=o.material;if(/Bottom|Footwear/.test(m.name))o.visible=false;m.envMapIntensity=.8;if(m.map)m.map.anisotropy=4}});
  head.add(av)},undefined,e=>console.warn('avatar failed to load',e))})();
// headphones
const hp=new T.Group();hp.scale.setScalar(1.12);head.add(hp);hp.add(M(new T.TorusGeometry(1.3,.07,16,80,Math.PI),silver,[0,.05,0]));
hp.add(M(new T.TorusGeometry(1.25,.1,12,60,Math.PI*.6),leather,[0,.05,0]).rotateZ(Math.PI*.2));
function cup(sg){const g=new T.Group();g.position.set(sg*1.28,.05,0);const a=new T.Group();a.rotation.z=Math.PI/2;g.add(a);
 a.add(M(new T.CylinderGeometry(.58,.58,.3,48),silver));
 a.add(M(new T.CylinderGeometry(.42,.42,.07,48),navyM,[0,-sg*.17,0]));
 const r=M(new T.TorusGeometry(.5,.025,10,48),silver,[0,-sg*.19,0]);r.rotation.x=Math.PI/2;a.add(r);
 const c=M(new T.TorusGeometry(.43,.17,16,48),leather,[0,sg*.2,0]);c.rotation.x=Math.PI/2;a.add(c);return g}
hp.add(cup(1),cup(-1));

// Sound waves from cups
const waves=[];
[-1,1].forEach(sg=>{for(let i=0;i<4;i++){const m=new T.Mesh(new T.RingGeometry(.9,.93,64),new T.MeshBasicMaterial({color:i%2?0xb8bfca:0x6f8bb0,transparent:true,depthWrite:false,blending:T.AdditiveBlending,side:T.DoubleSide,fog:false}));m.rotation.y=Math.PI/2;head.add(m);waves.push({m,sg,ph:i/4})}});

// Floating notes
const noteMats=['♪','♫','♩','♬'].map((g,i)=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.font='96px serif';x.textAlign='center';x.textBaseline='middle';x.fillStyle=['#efe5cf','#8fa8cc','#c9d2e0','#efe5cf'][i];x.shadowColor='rgba(143,168,204,.9)';x.shadowBlur=14;x.fillText(g,64,68);const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;return new T.SpriteMaterial({map:t,transparent:true,depthWrite:false,fog:false})});
const notes=[];for(let i=0;i<16;i++){const s=new T.Sprite(noteMats[i%4].clone());const sc=R(.45,.9);s.scale.set(sc,sc,1);scene.add(s);notes.push({s,a:R(0,6.28),r:R(2,4),sp:R(.05,.1),ph:rand()})}

// Dust
{const n=500,p=new Float32Array(n*3);for(let i=0;i<n;i++){p[i*3]=R(-66,12);p[i*3+1]=R(-3.5,6);p[i*3+2]=R(-9,6)}
const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(p,3));
window.dust=new T.Points(g,new T.PointsMaterial({color:0xefe5cf,size:.06,transparent:true,opacity:.55,depthWrite:false,fog:false}));scene.add(dust)}

// Album art
const PAL=[['#0f1b33','#efe5cf','#6f8bb0','#b8bfca'],['#efe5cf','#16294a','#c9703f','#6f8bb0'],['#6f8bb0','#0f1b33','#efe5cf','#d9a441'],['#b8bfca','#16294a','#efe5cf','#8a3b2e'],['#16294a','#d9a441','#efe5cf','#6f8bb0'],['#efe5cf','#6f8bb0','#0f1b33','#b8bfca']];
function art(x,c,r,st,p){x.save();x.beginPath();x.arc(c,c,r,0,6.283);x.clip();x.fillStyle=p[0];x.fillRect(c-r,c-r,2*r,2*r);
 if(st==0){for(let i=0;i<24;i+=2){x.fillStyle=p[1];x.beginPath();x.moveTo(c,c);x.arc(c,c,r,i*Math.PI/12,(i+1)*Math.PI/12);x.fill()}x.fillStyle=p[2];x.beginPath();x.arc(c,c,r*.38,0,6.283);x.fill();x.strokeStyle=p[3];x.lineWidth=r*.04;x.stroke()}
 else if(st==1){for(let i=6;i>0;i--){x.fillStyle=p[i%4];x.beginPath();x.arc(c,c,r*i/6,0,6.283);x.fill()}}
 else if(st==2){x.fillStyle=p[2];x.beginPath();x.arc(c,c-r*.1,r*.45,0,6.283);x.fill();x.fillStyle=p[1];x.fillRect(c-r,c+r*.15,2*r,r);x.fillStyle=p[3];for(let i=0;i<6;i++)x.fillRect(c-r,c+r*(.25+i*.13),2*r,r*.03*(i+1)*.6)}
 else if(st==3){const n=8,s=2*r/n;for(let i=0;i<n;i++)for(let j=0;j<n;j++){x.fillStyle=(i+j)%2?p[0]:p[1];x.fillRect(c-r+i*s,c-r+j*s,s,s)}x.fillStyle=p[2];x.beginPath();x.arc(c,c,r*.4,0,6.283);x.fill();x.fillStyle=p[3];x.beginPath();x.arc(c,c,r*.18,0,6.283);x.fill()}
 else if(st==4){[1,.75,.5,.28].forEach((k,i)=>{x.fillStyle=p[(i+1)%4];x.beginPath();x.arc(c,c+r*.35,r*k,Math.PI,0);x.lineTo(c+r*k,c+r);x.lineTo(c-r*k,c+r);x.fill()})}
 else{for(let i=0;i<9;i++){x.fillStyle=p[i%4];x.beginPath();x.moveTo(c-r,c+r);for(let u=-r;u<=r;u+=8)x.lineTo(c+u,c-r+i*r*.24+Math.sin(u*.03+i)*r*.12);x.lineTo(c+r,c+r);x.fill()}}
 x.restore()}
function tex(cd,st,p,vc){const z=512,c=256,cv=document.createElement('canvas');cv.width=cv.height=z;const x=cv.getContext('2d');
 if(cd){const g=x.createRadialGradient(c,c,20,c,c,c);g.addColorStop(0,'#e6eaf0');g.addColorStop(1,'#8c95a3');x.fillStyle=g;x.beginPath();x.arc(c,c,c,0,6.283);x.fill();
  art(x,c,c-8,st,p);x.fillStyle=x.createRadialGradient(c,c,10,c,c,70);const h=x.createRadialGradient(c,c,10,c,c,72);h.addColorStop(0,'#16294a');h.addColorStop(.3,'#d8dde5');h.addColorStop(1,'#9aa3b1');x.fillStyle=h;x.beginPath();x.arc(c,c,72,0,6.283);x.fill();x.fillStyle='#0f1b33';x.beginPath();x.arc(c,c,20,0,6.283);x.fill()}
 else{x.fillStyle=vc;x.beginPath();x.arc(c,c,c,0,6.283);x.fill();for(let r=118;r<c;r+=3){x.strokeStyle=r%2?'rgba(255,255,255,.07)':'rgba(0,0,0,.3)';x.beginPath();x.arc(c,c,r,0,6.283);x.stroke()}
  if(x.createConicGradient){const g=x.createConicGradient(.6,c,c);g.addColorStop(0,'rgba(255,255,255,.22)');g.addColorStop(.12,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,255,255,.18)');g.addColorStop(.62,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(255,255,255,.22)');x.fillStyle=g;x.beginPath();x.arc(c,c,c,0,6.283);x.fill()}
  art(x,c,112,st,p);x.strokeStyle='#b8bfca';x.lineWidth=3;x.beginPath();x.arc(c,c,114,0,6.283);x.stroke();x.fillStyle='#0a0f1c';x.beginPath();x.arc(c,c,9,0,6.283);x.fill()}
 const t=new T.CanvasTexture(cv);t.encoding=T.sRGBEncoding;t.anisotropy=4;return t}
const AL=[["Midnight Hi-Fi","The Velvet Static",1968,"Blue Velvet Hours|Static in Your Hair|Last Call, First Light|Hi-Fi Heartbeat"],
["Blue Hour Radio","Marlowe & Moon",1971,"Dial Turns Slow|Signal Over the Bay|Blue Hour|Station Ident"],
["Sunday Static","Cassette Gardens",1983,"Rewind Me Home|Tape Hiss Lullaby|Porch Light Fade|Side B Forever"],
["Echoes in Cream","Orla Vance",1975,"Porcelain Sky|Echoes in Cream|Velvet Hallway|Coda for Two"],
["Analog Tides","The Lantern Club",1969,"Low Tide Waltz|Lantern Parade|Needle & Thread|Harbor Hum"],
["Silver Lining Sessions","June Halloway",1977,"Silver Lining|Cigarette Moon|Spin Me Round|Quiet Encore"],
["Neon Parlor","Pale Carousel",1986,"Parlor Lights|Carousel Eyes|Soda Fountain Blues|Closing Time"],
["Golden Needle","Sam Ortega Trio",1964,"Golden Needle|Brushes on Rain|Corner Booth|Last Train Swing"],
["Paper Moons","Ivy & the Ferries",1972,"Paper Moons|Ferry Home|Kite String|Bluebird Radio"],
["Late Night Tapes","Kestrel Row",1981,"Tape One|Kestrel Row|3 A.M. Dial|Hold the Line"],
["Harbor Lights","The Quiet Lines",1967,"Harbor Lights|Foghorn Serenade|Salt & Cream|Slow Boat Home"],
["Dial Tone Dreams","Mabel Crane",1979,"Dial Tone Dreams|Party Line|Call Me Back|Operator, Please"]];
const VC=['#0a0f1c','#16294a','#efe5cf','#0a0f1c','#3b5273','#b8bfca','#0a0f1c','#16294a','#0a0f1c','#6f8bb0','#0a0f1c','#efe5cf'];
const recs=[],hits=[];
AL.forEach((a,i)=>{const cd=i%3==2,t=tex(cd,i%6,PAL[(i*5)%6],VC[i]);
 const side=new T.MeshStandardMaterial({color:cd?0xc9ced6:0x0a0f1c,roughness:.4,metalness:cd?1:.2});
 const face=new T.MeshStandardMaterial({map:t,roughness:cd?.25:.4,metalness:cd?.7:.25});
 const mesh=new T.Mesh(new T.CylinderGeometry(1,1,cd?.05:.07,72),[side,face,face]);mesh.rotation.x=Math.PI/2;mesh.castShadow=mesh.receiveShadow=true;
 const spin=new T.Group();spin.add(mesh);const g=new T.Group();g.add(spin);scene.add(g);
 const r={g,spin,mesh,a,i,sp:R(.15,.5)*(i%2?-1:1),ph:R(0,6),bf:R(.4,.9),tx:R(-.5,.5),ty:R(-.5,.5),pl:false,base:new T.Vector3(),size:1};
 mesh.userData.r=r;hits.push(mesh);recs.push(r);g.scale.setScalar(.01)});

// State
let W,H,aspect,camZ,p=0,pt=0,sel=null,hov=null,px=0,py=0,pxT=0,pyT=0,snapT;
const CX=-42,tan20=Math.tan(20*Math.PI/180);
function layout(){const cols=aspect<.8?3:aspect<1.3?3:4,rows=Math.ceil(12/cols),vw=2*tan20*camZ*aspect,vh=2*tan20*camZ;
 const sx=vw*.82/cols,sy=vh*.74/rows;rand=(()=>{let s=11;return()=>(s=s*16807%2147483647)/2147483647})();
 recs.forEach((r,i)=>{const c=i%cols,w=Math.floor(i/cols);r.size=Math.min(sx,sy)*R(.4,.72);
  r.base.set(CX+(c-(cols-1)/2)*sx+R(-.15,.15)*sx,((rows-1)/2-w)*sy*.95+R(-.15,.15)*sy-.2,R(-4,2))})}
function resize(){W=innerWidth;H=innerHeight;aspect=W/H;renderer.setSize(W,H,false);camera.aspect=aspect;camera.updateProjectionMatrix();camZ=Math.max(8.2,3.9/(2*tan20*aspect));layout()}
addEventListener('resize',resize);resize();

// Interaction
const ray=new T.Raycaster(),mv=new T.Vector2(),tip=$('#tip');
function pick(x,y){mv.set(x/W*2-1,-(y/H)*2+1);ray.setFromCamera(mv,camera);const h=ray.intersectObjects(hits,false)[0];return h?h.object.userData.r:null}
function setP(v,snap){pt=Math.max(0,Math.min(1,v));if(pt<.9&&sel)close_()}
addEventListener('wheel',e=>{e.preventDefault();setP(pt+(e.deltaY-e.deltaX)*.0013);clearTimeout(snapT);snapT=setTimeout(()=>{pt=pt>.5?1:0},160)},{passive:false});
let dn=null,dragged=0;
const cv=$('#c');
cv.addEventListener('pointerdown',e=>{dn={x:e.clientX,p0:pt};dragged=0});
addEventListener('pointermove',e=>{pxT=e.clientX/W-.5;pyT=e.clientY/H-.5;
 if(dn){const dx=e.clientX-dn.x;dragged=Math.max(dragged,Math.abs(dx));if(dragged>8)setP(dn.p0+dx/W*1.3)}
 else if(p>.7&&e.pointerType!=='touch'){hov=pick(e.clientX,e.clientY);cv.style.cursor=hov?'pointer':'default';
  tip.style.opacity=hov?1:0;if(hov){tip.textContent=hov.a[0]+' — '+hov.a[1];tip.style.left=e.clientX+'px';tip.style.top=e.clientY+'px'}}});
addEventListener('pointerup',e=>{if(!dn)return;const moved=dragged>8;dn=null;
 if(moved){pt=pt>.5?1:0;return}
 if(p>.7){const r=pick(e.clientX,e.clientY);r?open_(r):close_()}});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')pt=1;if(e.key==='ArrowRight'){pt=0}if(e.key==='Escape')close_()});
$('#n0').onclick=()=>pt=0;$('#n1').onclick=()=>pt=1;

function open_(r){if(sel&&sel!==r)sel.pl=false;sel=r;r.pl=false;
 $('#pt').textContent=r.a[0];$('#pb').textContent=r.a[1]+' · '+r.a[2];
 $('#pl').innerHTML=r.a[3].split('|').map((t,i)=>`<li><span>${i+1}. ${t}</span><em>${2+((r.i+i*3)%3)}:${String(10+(r.i*7+i*13)%49)}</em></li>`).join('');
 $('#pp').textContent='▶ Preview';$('#panel').classList.remove('playing');$('#panel').classList.add('open');tip.style.opacity=0}
function close_(){if(sel)sel.pl=false;sel=null;$('#panel').classList.remove('open','playing')}
$('#px').onclick=close_;
$('#pp').onclick=()=>{if(!sel)return;sel.pl=!sel.pl;$('#pp').textContent=sel.pl?'❚❚ Pause':'▶ Preview';$('#panel').classList.toggle('playing',sel.pl)};

// Loop
const clock=new T.Clock(),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const v1=new T.Vector3(),v2=new T.Vector3(),v3=new T.Vector3(),tq=new T.Quaternion(),eu=new T.Euler(),tgt=new T.Vector3();
function frame(){requestAnimationFrame(frame);
 const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 p+=(pt-p)*(1-Math.exp(-dt*4.5));px+=(pxT-px)*.05;py+=(pyT-py)*.05;
 const e=ease(p),it=Math.min(1,t/3.4),ei=1-Math.pow(1-it,3),land=aspect>1.2?1:0,off=-1.1*land*(1-e);
 const cx=T.MathUtils.lerp(0,CX,e)+off;
 camera.position.set(cx+px*.8,.45+Math.sin(Math.PI*e)*.9-py*.5,camZ+Math.sin(Math.PI*e)*3+(1-ei)*5);
 camera.lookAt(cx-Math.sin(Math.PI*e)*3,.1,0);
 lg.position.x=cx;
 // head
 head.rotation.y=Math.sin(t*.4)*.7;eyeBones.forEach(e=>{e.rotation.y=Math.max(-.5,Math.min(.5,-head.rotation.y*.75+px*.5));e.rotation.x=py*.4});head.rotation.z=Math.sin(t*.8)*.02;head.position.y=.2+Math.sin(t*1.2)*.05;
 waves.forEach(w=>{const u=(t*.45+w.ph)%1;w.m.position.set(w.sg*(1.55+u*1.8),.05,0);w.m.scale.setScalar(.6+u*1.4);w.m.material.opacity=(1-u)*.5});
 notes.forEach(n=>{const u=(t*n.sp+n.ph)%1,a=n.a+t*.18;n.s.position.set(Math.cos(a)*n.r,-2.5+u*6.5,Math.sin(a)*n.r*.6+.5);n.s.material.opacity=Math.sin(u*Math.PI)*.9});
 dust.position.y=Math.sin(t*.1)*.3;
 // records
 const k=1-Math.exp(-dt*5),vw5=2*tan20*5.5*aspect;
 camera.matrixWorld.extractBasis(v1,v2,v3);
 recs.forEach(r=>{const s=sel===r,hv=hov===r&&!sel||hov===r;
  r.spin.rotation.z+=dt*r.sp*(r.pl?5:1)*(s?.6:1);
  if(s){camera.getWorldDirection(tgt);tgt.multiplyScalar(5.5).add(camera.position);
   if(land)tgt.addScaledVector(v1,-Math.min(1.7,vw5*.17));else tgt.addScaledVector(v2,.9);
   r.g.position.lerp(tgt,k);r.g.quaternion.slerp(camera.quaternion,k);r.g.scale.setScalar(r.g.scale.x+(Math.min(1.7,vw5*.4)-r.g.scale.x)*k)}
  else{tgt.copy(r.base);tgt.y+=Math.sin(t*r.bf+r.ph)*.18;tgt.x+=Math.cos(t*r.bf*.7+r.ph)*.08;
   r.g.position.lerp(tgt,k);eu.set(r.tx+Math.sin(t*.4+r.ph)*.1,r.ty+Math.cos(t*.35+r.ph)*.12,0);tq.setFromEuler(eu);r.g.quaternion.slerp(tq,k);
   const ts=e>.15?r.size*(hv?1.12:1):.01;r.g.scale.setScalar(r.g.scale.x+(ts-r.g.scale.x)*k)}});
 // UI
 const io=Math.max(0,1-p*2.4);$('#intro').style.opacity=io;$('#intro').style.transform=`translateX(${-p*60}px)`;
 $('#coll').style.opacity=Math.max(0,Math.min(1,(p-.6)*2.5));
 $('#hint').style.opacity=io*.8;
 $('#n0').classList.toggle('on',p<.5);$('#n1').classList.toggle('on',p>=.5);
 renderer.render(scene,camera)}
frame();
</script></body></html>
