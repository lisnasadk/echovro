spring.application.name=echovro

spring.datasource.url=jdbc:mysql://localhost:3306/echovro
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# ---- JWT login tokens ----
echovro.jwt.secret=${JWT_SECRET}
echovro.jwt.expiration-ms=604800000

# ---- Frontend addresses allowed to call this API (add your live site later) ----
echovro.cors.origins=http://localhost:5500,http://127.0.0.1:5500