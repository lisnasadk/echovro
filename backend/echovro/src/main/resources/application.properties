spring.application.name=echovro
server.port=${PORT:8080}

# ==========================================
# DATABASE CONFIGURATION
# Default: Embedded H2 database (works instantly with zero install/setup)
# ==========================================
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/echovro;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ==========================================
# FOR MYSQL DATABASE (UNCOMMENT & CONFIGURE IF USING MYSQL):
# ==========================================
# spring.datasource.url=jdbc:mysql://localhost:3306/echovro?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=rootpassword
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ---- JWT login tokens ----
echovro.jwt.secret=${JWT_SECRET:change-me-to-a-long-secret-key-123456-echovro-super-secret-key-32bytes}
echovro.jwt.expiration-ms=604800000

# ---- Frontend addresses allowed to call this API ----
echovro.cors.origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,https://echovrolive.vercel.app}