spring.application.name=echovro
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:echovro;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# ---- JWT login tokens ----
echovro.jwt.secret=${JWT_SECRET:change-me-to-a-long-secret-key-123456}
echovro.jwt.expiration-ms=604800000

# ---- Frontend addresses allowed to call this API ----
echovro.cors.origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}